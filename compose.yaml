# JUMAL – root-level Docker Compose
#
# Usage (run from the repository root):
#   docker compose up -d          # start all services
#   docker compose down           # stop all services
#   docker compose logs -f ollama # stream Ollama logs
#
# Services:
#   ollama – local LLM inference server (OpenAI-compatible API on port 11434)
#
# The static-analyzer image (docker/analyzer/) is NOT a long-running service.
# JUMAL builds and launches it on demand for each file analysis request.
# You do not need to start it here.

services:
  jumal-ollama:
    image: ollama/ollama
    container_name: jumal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Start the server, then pull the default model if not already present
    entrypoint: /bin/sh
    command: >
      -c "ollama serve &
          sleep 5 &&
          ollama pull llama3.2:1b &&
          wait"
    restart: unless-stopped

volumes:
  ollama_data:
    name: jumal-ollama-data
